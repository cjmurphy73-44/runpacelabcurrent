name: TrainPaceLab CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev, fix/support-security-integration-20261116, fix/pr239-static-tests-node-env-20261117, test/tpl-fail-closed-fetch-20261117 ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Read-only exact-lockfile dependency audit
        shell: bash
        run: |
          npm audit --json > /tmp/tpl-audit.json || audit_status=$?
          node -e 'const fs=require("node:fs"); const a=JSON.parse(fs.readFileSync("/tmp/tpl-audit.json","utf8")); if(a.error || !a.vulnerabilities || !a.metadata?.vulnerabilities) { console.error("Audit report unavailable", a.error || "missing vulnerability data"); process.exit(1); } console.log("AUDIT_SUMMARY_JSON=" + JSON.stringify({metadata:a.metadata.vulnerabilities,packages:Object.entries(a.vulnerabilities).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:v.via,effects:v.effects,fixAvailable:v.fixAvailable,nodes:v.nodes}))}));'

      - name: Run Type Check
        run: npm run typecheck

      - name: Run Test Suite
        run: npm run test:ci

      - name: Run Lint
        run: npm run lint

      - name: Build production frontend
        run: npm run build

      - name: Verify release bundle contains no source maps
        shell: bash
        run: |
          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo 'Release bundle contains source maps; aborting.'
            exit 1
          fi
          echo 'No source maps in release bundle.'
